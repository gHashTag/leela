name: CI

on:
  push:
    branches: [unified, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: |
          for pkg in packages/engine packages/content packages/journal packages/db packages/ai packages/contracts apps/bot apps/miniapp apps/docs; do
            echo "::group::typecheck $pkg"
            (cd "$pkg" && bunx tsc --noEmit)
            echo "::endgroup::"
          done

      # The shipped code, with `noUncheckedIndexedAccess`. Two functions here
      # were typed to return a value and returned undefined - `ruleSetById` for
      # a variant no longer known, `currentPlayer` for a stale turn index - and
      # each made a chat throw on every command, forever, three files from the
      # row that was wrong. Tests are out of scope: `rows[0]` there is a value
      # the test built two lines earlier.
      - name: Typecheck what ships
        run: |
          for pkg in packages/engine packages/content packages/journal packages/db packages/ai packages/contracts apps/bot apps/miniapp apps/docs; do
            echo "::group::strict $pkg"
            (cd "$pkg" && bunx tsc --noEmit -p tsconfig.src.json)
            echo "::endgroup::"
          done

      - name: Test
        run: |
          for pkg in packages/engine packages/content packages/journal packages/db packages/ai packages/contracts apps/bot apps/miniapp apps/docs; do
            echo "::group::test $pkg"
            (cd "$pkg" && bunx vitest run)
            echo "::endgroup::"
          done

  # Three fields in three passes were written everywhere and read nowhere -
  # broadcast, rerollOnRepeat, needs_report - each looking complete in review.
  # Reported rather than enforced: a field can be legitimately write-only, and a
  # check that fails a build on a judgement call gets switched off.
  # The bot ships as an image, and a Dockerfile that is never built is a
  # description nobody has checked. Two defects were found in this one by hand
  # and both fail the build step: a frozen install missing two workspace
  # manifests, and host node_modules copied over the installed ones.
  bot-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t leela-bot -f apps/bot/Dockerfile .

      # Building proves it compiles; running proves it runs. The token is
      # deliberately a fake one: a 401 is the single failure the bot refuses to
      # retry, so the container says everything it has to say and then exits 0.
      # Anything else ending the run is the defect this job is looking for.
      #
      # `/data` exists in the image because of the `VOLUME` instruction, so
      # this step does not test a missing directory — the step below does that,
      # with a path that cannot be made.
      - name: Start with no volume mounted
        run: |
          set -uo pipefail
          docker run --rm -e BOT_TOKEN=1:TEST leela-bot > out.log 2>&1
          code=$?
          cat out.log

          if [ "$code" -ne 0 ]; then
            echo "::error::the bot died rather than starting (code $code)"
            exit 1
          fi
          grep -q 'Leela bot starting' out.log \
            || { echo '::error::the bot never started'; exit 1; }
          grep -q 'kept in /data/leela.db' out.log \
            || { echo '::error::games were not kept, with no volume mounted'; exit 1; }
          grep -q 'token was rejected' out.log \
            || { echo '::error::something other than the fake token ended the run'; exit 1; }

      - name: Start with a path that cannot be opened
        run: |
          set -uo pipefail
          docker run --rm -e BOT_TOKEN=1:TEST -e LEELA_DB=/proc/leela.db leela-bot > out.log 2>&1
          code=$?
          cat out.log

          if [ "$code" -ne 0 ]; then
            echo "::error::the bot died rather than falling back to memory (code $code)"
            exit 1
          fi
          # Verified to discriminate: with the fallback removed, this image
          # exits 1 and prints nothing but a stack trace.
          #
          # Named, with the path in it, because the answer is almost always a
          # mount point that is not there.
          grep -q 'could not open /proc/leela.db' out.log \
            || { echo '::error::the failure was not named'; exit 1; }
          grep -q 'held in memory' out.log \
            || { echo '::error::it did not say games are held in memory'; exit 1; }

  unread-fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: node scripts/audit-unread.mjs

      # A flag turned on in eight packages is a flag that will be missing from
      # the ninth. Enforced rather than reported: unlike a write-only field,
      # there is no judgement call in whether a config file exists.
      - run: node scripts/audit-configs.mjs

      # The per-package counts in README.md, against the suites that produce
      # them. Maintained by hand for forty passes, which is exactly how long a
      # number survives before it is quietly wrong.
      - run: node scripts/audit-claims.mjs

      # The board references inside the traditional text. Reports the damage it
      # already knows about and fails only on a loss nobody has recorded, which
      # is what a rebuild from a different source would produce.
      - run: node scripts/audit-numbers.mjs

      # The rules book's table of contents. Three books came through a
      # different donor and are missing chapters the two editions agree on;
      # this names them and fails on a fourth.
      - run: node scripts/audit-book.mjs

      # Every control the mini app draws as available, against the decision
      # behind it. Three defects in three passes came from an act that trusted
      # a drawing; a drawing decided inline is one nothing else can call.
      - run: node scripts/audit-drawings.mjs

      # Which functions read the seat holding the turn. Three defects in three
      # passes came from one that had a seat of its own and did not ask for it.
      - run: node scripts/audit-whose.mjs

      # Every script starts under the runtime it names, and every audit is
      # either run here or says in its own header why it cannot be. audit-copies
      # - the check that reads eighteen copies of the board - sat broken under
      # `node` for passes, and nothing noticed, because a check nobody can run
      # reads exactly like a check that passes.
      - run: node scripts/audit-scripts.mjs

  content-is-reproducible:
    # The dataset under packages/content/data is generated, and this job checks
    # it is whole — every language the package declares, every plan, in order,
    # with text. It cannot check it is *reproducible*: rebuilding needs the
    # donor clones, which are not here. The generator refuses to write a dataset
    # smaller than the one already committed, which is the half of that promise
    # that can be kept without them. The job name is older than the promise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Held to `LANGUAGES` in packages/content/src, not to the manifest's own
      # list. The check this replaces iterated the languages the manifest named,
      # so an empty manifest was zero iterations and a green job — and a stray
      # rebuild from a source directory that did not exist emptied it exactly
      # that way.
      - run: bun install --frozen-lockfile
      - run: bun scripts/audit-dataset.mjs
