name: CI

on:
  push:
    branches: [unified, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: |
          for pkg in packages/engine packages/content packages/db packages/ai packages/contracts apps/bot apps/miniapp apps/docs; do
            echo "::group::typecheck $pkg"
            (cd "$pkg" && bunx tsc --noEmit)
            echo "::endgroup::"
          done

      # The shipped code, with `noUncheckedIndexedAccess`. Two functions here
      # were typed to return a value and returned undefined - `ruleSetById` for
      # a variant no longer known, `currentPlayer` for a stale turn index - and
      # each made a chat throw on every command, forever, three files from the
      # row that was wrong. Tests are out of scope: `rows[0]` there is a value
      # the test built two lines earlier.
      - name: Typecheck what ships
        run: |
          for pkg in packages/engine packages/content packages/db packages/ai packages/contracts apps/bot apps/miniapp apps/docs; do
            echo "::group::strict $pkg"
            (cd "$pkg" && bunx tsc --noEmit -p tsconfig.src.json)
            echo "::endgroup::"
          done

      - name: Test
        run: |
          for pkg in packages/engine packages/content packages/db packages/ai packages/contracts apps/bot apps/miniapp apps/docs; do
            echo "::group::test $pkg"
            (cd "$pkg" && bunx vitest run)
            echo "::endgroup::"
          done

  # Three fields in three passes were written everywhere and read nowhere -
  # broadcast, rerollOnRepeat, needs_report - each looking complete in review.
  # Reported rather than enforced: a field can be legitimately write-only, and a
  # check that fails a build on a judgement call gets switched off.
  unread-fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: node scripts/audit-unread.mjs

      # A flag turned on in eight packages is a flag that will be missing from
      # the ninth. Enforced rather than reported: unlike a write-only field,
      # there is no judgement call in whether a config file exists.
      - run: node scripts/audit-configs.mjs

  content-is-reproducible:
    # The dataset under packages/content/data is generated. If a commit edits it
    # by hand the generator and the repository disagree, and the next rebuild
    # silently reverts the edit. This job makes that visible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check the dataset is well formed
        run: |
          bun run --bun - <<'EOF'
          const langs = JSON.parse(
            await Bun.file('packages/content/data/manifest.json').text(),
          ).languages;

          let failures = 0;
          for (const lang of langs) {
            const plans = JSON.parse(
              await Bun.file(`packages/content/data/plans.${lang}.json`).text(),
            );
            if (plans.length !== 72) {
              console.error(`${lang}: ${plans.length} plans, expected 72`);
              failures++;
              continue;
            }
            for (let i = 0; i < 72; i++) {
              const plan = plans[i];
              if (plan.plan !== i + 1) {
                console.error(`${lang}: plan ${i + 1} out of order`);
                failures++;
              }
              if (!plan.title?.trim() || !plan.body?.trim()) {
                console.error(`${lang}: plan ${plan.plan} is missing title or body`);
                failures++;
              }
            }
          }
          console.log(`checked ${langs.length} languages`);
          process.exit(failures > 0 ? 1 : 0);
          EOF
