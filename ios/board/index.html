<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `interactive-widget` is the declarative half of keeping the writing box
      above the keyboard: it asks the engine to resize the page when one comes
      up, rather than drawing it over the top. Engines that do not know the key
      ignore it, and iOS is currently among them - which is why `keyboard.ts`
      measures the visual viewport and lifts the sheet itself. Both, because the
      declarative one is where this is going and the measured one is what works
      on the phone in hand.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      Both, or the browser paints the canvas black before a single rule is read.
      This said `dark`, which is a promise about the page: the user agent fills
      the viewport with its dark background on the very first frame, and a light
      reader saw that flash on every load.
    -->
    <meta name="color-scheme" content="light dark" />
    <title>Leela — the board in three dimensions</title>

    <!--
      The same words the mini app's head carries, for the same reason: this page
      is a link people send each other, and a chat with nothing to build a
      preview from renders it as a bare URL.
    -->
    <meta name="description" content="The game of self-knowledge — 72 plans, in 22 languages." />
    <meta property="og:site_name" content="Leela" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Leela — the board in three dimensions" />
    <meta
      property="og:description"
      content="The game of self-knowledge — 72 plans, in 22 languages."
    />

    <!--
      The light, before the first paint.

      The stylesheet's default tokens are the dark ones and `main.ts` sets
      `data-look` when it runs - so a light reader met a black page for as long
      as the bundle took to parse, then a cream one. On a phone, coming off nine
      white onboarding screens, that reads as a fault rather than as loading.

      Inline and in the head, because anything deferred is by definition after
      the paint this exists to fix. Five lines, no imports: it cannot wait for
      the module graph.

      `look.ts` is the tested source of this rule and this is deliberately its
      smallest possible restatement - the same key, the same order: a stored
      choice, then the system, then dark. `settings.test.ts` holds the key in
      step; the order is short enough to read.
    -->
    <script>
      try {
        var asked = window.localStorage.getItem('leela.look');
        document.documentElement.dataset.look =
          asked === 'light' || asked === 'dark'
            ? asked
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="./assets/index-CYpoaQtN.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CX5nsVCt.css">
  </head>
  <body>
    <!--
      One screen. The board is the page; everything else sits over it.

      Not four screens with navigation between them, because the game is a loop
      of throw → land → read → write → throw, and a loop that crosses a screen
      boundary four times is a loop players leave. The reading is where the game
      is, so it is not behind a button.
    -->
    <canvas id="board" aria-label="The board, 72 plans"></canvas>

    <!-- Where you are. Over the board, never scrolled away. -->
    <header class="where" id="where">
      <span class="where-number" id="plan-number">—</span>
      <span class="where-title" id="plan-title">Throw a six to enter the game</span>

      <!--
        Settings: one button, at the top.

        They stood in the row with the die - three controls a player touches
        once, in the middle of the two they touch every turn - then across the
        header as three pills, competing with the plan's own name for a line
        that is already truncated on a phone. One mark, and the rest behind it.
      -->
      <div class="where-settings">
        <button
          class="gear"
          id="gear"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="settings"
        >
          <span class="gear-mark" aria-hidden="true">⋮</span>
        </button>

        <!--
          One button, and everything behind it.

          Three pills across the top were three decisions competing with the
          plan's own name for the same line, on a phone where that name is
          already truncated. They are settings: reached when wanted, out of the
          way otherwise.
        -->
        <div class="settings" id="settings" hidden>
          <button
            class="lotus"
            id="lotus"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="who"
          >
            <span class="lotus-mark" id="lotus-mark" aria-hidden="true"></span>
          </button>
          <button class="tongue" id="tongue" type="button"></button>
          <button class="look" id="look" type="button"></button>
        </div>
      </div>

      <progress class="where-progress" id="progress" max="1" value="0"></progress>
    </header>

    <!--
      A square that is not the one you are standing on, opened by tapping it.
      A strip rather than a dialog: a dialog would take the board away, and
      comparing a square with the board is the reason to tap one.
    -->
    <div class="visiting" id="visiting" hidden>
      <span id="visiting-text"></span>
      <button type="button" id="visiting-back" class="ghost">Back to my square</button>
    </div>

    <!--
      The sheet. Three detents — enough to play, enough to read, all of it —
      dragged or stepped with the handle. The pattern is the one every map app
      uses for the same problem: a surface that must be both out of the way and
      immediately to hand, on a screen with no room for two.
    -->
    <section class="sheet" id="sheet" data-detent="half" aria-label="This plan, and the companion">
      <button
        class="handle"
        id="handle"
        type="button"
        aria-expanded="false"
        aria-controls="sheet-body"
        aria-label="Expand"
      ></button>

      <!--
        One line: the throw, where you are, and who you are.

        The deity strip used to stand under this as a row of its own, about a
        hundred and thirty pixels of sheet for a choice most players make once.
        It is a lotus at the end of this line now, and the roster opens from it.
      -->
      <div class="play">
        <button class="die" id="die" type="button" aria-label="Throw the die">
          <span class="face" id="face" aria-hidden="true"></span>
        </button>
        <p class="say" id="say" role="status" aria-live="polite">A six puts you on the board.</p>
        <p class="owed" id="owed" role="status" aria-live="polite" hidden></p>

        <!--
          Three throws free, then the game asks.

          Beside the die rather than over the board: this is a fact about the
          control the player is reaching for, and a dialog would take the board
          away to say it. The button is only shown when there is an app to ask —
          `toll.ts` never charges a page that cannot be paid on.
        -->
        <p class="toll" id="toll" role="status" aria-live="polite" hidden></p>
        <button class="toll-open" id="toll-open" type="button" hidden></button>
      </div>

      <!--
        Who is playing.

        Every name on this list is one the seventy-two texts use — see
        `deities.ts`. Opened from the lotus rather than always on screen, and
        still not a dialog: choosing mid-game should not take the board away.
      -->
      <div class="who" id="who" hidden>
        <div class="who-count" id="who-count" role="radiogroup"></div>
        <div class="who-list" id="who-list" role="radiogroup" aria-label="Play as"></div>
      </div>

      <!--
        What the player is playing for.

        Above the conversation and never scrolled away, because it is the frame
        every report below it is written inside — `apps/miniapp/src/state.ts`
        argues that out: in Leela the intention is not a profile field, it is
        the question the game answers.
      -->
      <button class="intention" id="intention" type="button">
        <span class="intention-label" id="intention-label"></span>
        <span class="intention-text" id="intention-text"></span>
      </button>

      <div class="sheet-body" id="sheet-body">
        <!--
          One column, in the order things happened.

          The plan you are standing on is not a panel above the conversation —
          it is the companion's first remark about it, and it opens out to the
          whole text in place. Two surfaces showing the same paragraph, one of
          them scrolled permanently out of reach, is what the first pass had.
        -->
        <div class="thread" id="thread" aria-live="polite" aria-label="The companion"></div>

        <!--
          A square you tapped but are not standing on, read in place of the
          thread rather than beside it. Looking at 68 from square 9 is a real
          part of playing, and it is not a thing the companion said to you.
        -->
        <article class="visiting-plan" id="visiting-plan" hidden>
          <h2 class="plan-heading" id="plan-heading"></h2>
          <div class="plan-text" id="plan-text"></div>
        </article>

        <!--
          Where you have been.

          Derived from the throws by `pathOf`, never stored as squares — see
          `path.ts`. Collapsed, because it grows without bound and the thread
          above it is what a player is reading between throws.
        -->
        <details class="path" id="path">
          <summary id="path-summary">My path</summary>
          <ol class="path-list" id="path-list"></ol>
        </details>

        <!-- Out of the browser, and back into it. -->
        <div class="carry">
          <p class="carry-said" id="carry-said" role="status" aria-live="polite"></p>
        </div>

        <details class="rests" id="rests">
          <summary id="rests-summary">What this rests on</summary>
          <dl class="rests-list" id="rests-list"></dl>
        </details>
      </div>

      <form class="compose" id="compose">
        <label class="visually-hidden" for="reply">What does this plan bring up?</label>
        <textarea
          id="reply"
          rows="1"
          enterkeyhint="send"
          placeholder="What does this plan bring up?"
        ></textarea>
        <button type="submit" id="send" class="send" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z" fill="currentColor" />
          </svg>
        </button>
      </form>
    </section>

  </body>
</html>
